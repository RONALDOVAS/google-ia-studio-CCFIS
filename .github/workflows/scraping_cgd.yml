name: Execução Manual Scraping CGD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: false

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium
      - name: Validar parser de frequência determinístico
        shell: powershell
        run: |
          python -m unittest -v test_frequencia_parser_cgd.py
      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @('CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL','CGD_USER_MATRIZ','CGD_PASS_MATRIZ','CGD_USER_FILIAL','CGD_PASS_FILIAL','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Secret obrigatório ausente: $name" }
            Write-Host "$name = OK"
          }
      - name: Executar scraper CGD - etapa 750 por unidade + refresh rotativo
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '100'
          CGD_LISTING_WAIT_MS: '100'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_DETAIL_HTTP_WORKERS: '1'
          CGD_DETAIL_WORKERS: '1'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_LIMIT: '10000'
          CGD_DETAIL_TARGET_PER_UNIT: '750'
          CGD_REFRESH_PER_UNIT: '20'
          CGD_LISTING_PAGES: '831'
          CGD_DETAIL_INTERVAL_MS: '200'
          CGD_HEADLESS: 'false'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== ETAPA 750/750: preservar alunos + acrescentar novos + refresh rotativo de existentes ==='
          python -u scraper_sync_robusto.py
      - name: Auditar frequencias reais, ultimo acesso e Frequencias a Registrar
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_PAGE_WAIT_MS: '100'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== AUDITORIA DE FREQUENCIA: registros = presencas + faltas | ultimo acesso | a registrar ==='
          python -u auditar_frequencias_cgd.py
      - name: Validar captura real e base auditada
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) { throw 'Falha: dados_alunos.json não foi gerado.' }
          if (-not (Test-Path 'dados_populacao_cgd.json')) { throw 'Falha: snapshot da população real do CGD não foi gerado.' }
          if (-not (Test-Path 'dados_dashboard_cgd.json')) { Write-Warning 'dados_dashboard_cgd.json não foi gerado; dashboard é apenas informativo e não bloqueia a aprovação.' }
          if (-not (Test-Path 'dados_pacotes_cursos.json')) { throw 'Falha: dados_pacotes_cursos.json não foi gerado.' }
          if (-not (Test-Path 'dados_frequencias_a_registrar.json')) { throw 'Falha: snapshot de Frequencias a Registrar não foi gerado.' }
          @'
          import json
          from pathlib import Path
          dados = json.loads(Path('dados_alunos.json').read_text(encoding='utf-8'))
          pop = json.loads(Path('dados_populacao_cgd.json').read_text(encoding='utf-8'))
          pac = json.loads(Path('dados_pacotes_cursos.json').read_text(encoding='utf-8'))
          pend = json.loads(Path('dados_frequencias_a_registrar.json').read_text(encoding='utf-8'))
          if not isinstance(dados, list) or not dados:
              raise SystemExit('Falha: base de alunos vazia/inválida.')
          unidades_pop = {x.get('unidade'): x for x in pop.get('unidades', []) if x.get('unidade')}
          if set(unidades_pop) != {'matriz', 'filial'}:
              raise SystemExit('Falha: população real do CGD não foi registrada para matriz e filial.')
          matriz = [a for a in dados if a.get('unidade') == 'matriz']
          filial = [a for a in dados if a.get('unidade') == 'filial']
          contratos = [str(a.get('contrato') or '') for a in dados]
          duplicados = len(contratos) - len(set(contratos))
          freq_ok = [a for a in dados if not a.get('frequencia_raw') or (isinstance(a.get('frequencia_validacao_interna'), dict) and a['frequencia_validacao_interna'].get('matematica_ok'))]
          ultimo = [a for a in dados if a.get('ultimo_acesso')]
          freq_real = [a for a in dados if isinstance(a.get('frequencia_raw'), list) and a.get('frequencia_raw')]
          dash_ok = []
          if Path('dados_dashboard_cgd.json').exists():
              try:
                  dash = json.loads(Path('dados_dashboard_cgd.json').read_text(encoding='utf-8'))
                  dash_ok = [x for x in dash.get('unidades', []) if x.get('ok')]
              except Exception:
                  print('AVISO: dados_dashboard_cgd.json existe, mas não pôde ser interpretado; permanece fora dos critérios de aprovação.')
          pac_ok = [x for x in pac.get('unidades', []) if x.get('ok')]
          pend_ok = [x for x in pend.get('unidades', []) if x.get('url')]
          print(f'ALUNOS NA BASE: {len(dados)}')
          print(f'MATRIZ: {len(matriz)} / alvo efetivo {unidades_pop["matriz"].get("alvo_efetivo")} / contratos descobertos {unidades_pop["matriz"].get("contratos_descobertos")}')
          print(f'FILIAL: {len(filial)} / alvo efetivo {unidades_pop["filial"].get("alvo_efetivo")} / contratos descobertos {unidades_pop["filial"].get("contratos_descobertos")}')
          print(f'ALUNOS COM FREQUENCIA REAL: {len(freq_real)}')
          print(f'ALUNOS COM ULTIMO ACESSO REGISTRADO: {len(ultimo)}')
          print(f'FREQUENCIA VALIDA OU AUSENTE LEGITIMAMENTE: {len(freq_ok)}')
          print(f'DASHBOARD CGD CAPTURADO (INFORMATIVO): {len(dash_ok)}/2')
          print(f'FONTES DE PACOTES CAPTURADAS: {len(pac_ok)}/4')
          print(f'FREQUENCIAS A REGISTRAR CAPTURADAS: {len(pend_ok)}/2')
          print(f'CONTRATOS DUPLICADOS: {duplicados}')
          if duplicados:
              raise SystemExit(f'Falha: existem {duplicados} contratos duplicados.')
          for unidade, registros in (("matriz", matriz), ("filial", filial)):
              alvo_efetivo = int(unidades_pop[unidade].get('alvo_efetivo') or 0)
              descobertos = int(unidades_pop[unidade].get('contratos_descobertos') or 0)
              if alvo_efetivo <= 0 or descobertos <= 0:
                  raise SystemExit(f'Falha: população inválida para {unidade}: descobertos={descobertos}, alvo={alvo_efetivo}.')
              if len(registros) < alvo_efetivo:
                  raise SystemExit(f'Falha: etapa incompleta em {unidade}: persistidos={len(registros)}, alvo_efetivo={alvo_efetivo}.')
          if len(freq_ok) != len(dados):
              raise SystemExit('Falha: existe frequência capturada com matemática inválida.')
          if len(pac_ok) != 4:
              print(f'AVISO: fontes de pacote/relatório incompletas: {len(pac_ok)}/4. A coleta de alunos/frequência não será reprovada por esta fonte auxiliar.')
          '@ | python -
      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py
      - name: Validar reposições capturadas
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_reposicoes.json')) { throw 'Falha: dados_reposicoes.json não foi gerado.' }
          $rep = Get-Content 'dados_reposicoes.json' -Raw | ConvertFrom-Json
          Write-Host "REPOSICOES CAPTURADAS: $($rep.records.Count)"
          if ($rep.source -ne 'CGD') { throw 'Falha: fonte de reposições não é CGD.' }
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
            dados_dashboard_cgd.json
            dados_pacotes_cursos.json
            dados_frequencias_a_registrar.json
            dados_populacao_cgd.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json dados_dashboard_cgd.json dados_pacotes_cursos.json dados_frequencias_a_registrar.json dados_populacao_cgd.json
          if (git diff --cached --quiet) { Write-Host 'Nenhuma alteração nos dados sincronizados.' }
          else { git commit -m 'Auto-update: dados reais CGD'; git push }
