name: Execução Automática Scraping CGD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dados_alunos.json'
      - 'dados_reposicoes.json'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: true

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium

      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @(
            'CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL',
            'CGD_USER_MATRIZ','CGD_PASS_MATRIZ',
            'CGD_USER_FILIAL','CGD_PASS_FILIAL',
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Secret obrigatório ausente: $name"
            }
            Write-Host "$name = OK"
          }

      - name: Executar scraper CGD - teste mínimo 3 alunos por unidade + progresso
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '100'
          CGD_LISTING_WAIT_MS: '100'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_DETAIL_HTTP_WORKERS: '3'
          CGD_DETAIL_WORKERS: '3'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_LIMIT: '3'
          CGD_LISTING_PAGES: '1'
          CGD_HEADLESS: 'false'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          $total = 6
          $done = 0
          $failed = 0
          $started = Get-Date
          Write-Host ''
          Write-Host '================ PROGRESSO SCRAPER CGD ================'
          Write-Progress -Id 1 -Activity 'Scraping CGD' -Status 'Iniciando autenticação e coleta...' -PercentComplete 0
          & python -u scraper_runner.py 2>&1 | ForEach-Object {
            $line = $_.ToString()
            Write-Host $line
            if ($line -match 'CONTRATO_OK\s+(\d+)\/\d+') {
              $done++
              $pct = [math]::Min(100, [math]::Round(($done / $total) * 100, 0))
              $elapsed = (Get-Date) - $started
              $rate = if ($elapsed.TotalSeconds -gt 0) { $done / $elapsed.TotalSeconds } else { 0 }
              $eta = if ($rate -gt 0) { [TimeSpan]::FromSeconds(($total - $done) / $rate) } else { [TimeSpan]::Zero }
              Write-Progress -Id 1 -Activity "Scraping CGD - $pct%" -Status "Alunos: $done/$total | Falhas: $failed | Decorrido: $($elapsed.ToString('hh\:mm\:ss')) | ETA: $($eta.ToString('hh\:mm\:ss'))" -PercentComplete $pct
            } elseif ($line -match 'FALHA_DETALHE') {
              $failed++
              $pct = [math]::Min(100, [math]::Round((($done + $failed) / $total) * 100, 0))
              $elapsed = (Get-Date) - $started
              Write-Progress -Id 1 -Activity "Scraping CGD - $pct%" -Status "Alunos: $done/$total | Falhas: $failed | Decorrido: $($elapsed.ToString('hh\:mm\:ss'))" -PercentComplete $pct
            }
          }
          $exitCode = $LASTEXITCODE
          Write-Progress -Id 1 -Activity 'Scraping CGD' -Completed
          Write-Host "================ FIM SCRAPER | exit=$exitCode | sucesso=$done | falhas=$failed ================"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Validar captura real de alunos
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) {
            throw 'Falha: dados_alunos.json não foi gerado.'
          }
          $dados = @(Get-Content 'dados_alunos.json' -Raw | ConvertFrom-Json)
          if ($dados.Count -eq 0) {
            throw 'Falha: scraper terminou sem alunos. A execução NÃO será considerada sucesso.'
          }
          $comFreq = @($dados | Where-Object { $_.frequencia_raw -and $_.frequencia_raw.Count -gt 0 }).Count
          if ($comFreq -eq 0) {
            throw 'Falha: nenhum aluno possui frequência real capturada.'
          }
          $semFreq = $dados.Count - $comFreq
          Write-Host "ALUNOS CAPTURADOS: $($dados.Count)"
          Write-Host "ALUNOS COM FREQUENCIA REAL: $comFreq"
          Write-Host "ALUNOS SEM FREQUENCIA: $semFreq"
          if ($semFreq -gt 0) {
            throw "Falha: existem $semFreq alunos sem frequência real. A execução NÃO será considerada sucesso."
          }

      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py

      - name: Validar reposições capturadas
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_reposicoes.json')) {
            throw 'Falha: dados_reposicoes.json não foi gerado.'
          }
          $rep = Get-Content 'dados_reposicoes.json' -Raw | ConvertFrom-Json
          Write-Host "REPOSICOES CAPTURADAS: $($rep.records.Count)"

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json
          if (git diff --cached --quiet) {
            Write-Host 'Nenhuma alteração nos dados sincronizados.'
          } else {
            git commit -m 'Auto-update: dados reais CGD'
            git push
          }
