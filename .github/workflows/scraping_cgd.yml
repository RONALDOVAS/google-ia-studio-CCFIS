name: Execução Manual Scraping CGD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: false

jobs:
  coletar-cgd:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências e Chromium
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Validar parser de frequência determinístico
        shell: powershell
        run: python -m unittest -v test_frequencia_parser_cgd.py

      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @('CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL','CGD_USER_MATRIZ','CGD_PASS_MATRIZ','CGD_USER_FILIAL','CGD_PASS_FILIAL','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Secret obrigatório ausente: $name"
            }
            Write-Host "$name = OK"
          }

      - name: Sincronizar universo inteiro CGD - Matriz + Filial
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '0'
          CGD_LISTING_WAIT_MS: '0'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_DETAIL_HTTP_WORKERS: '1'
          CGD_DETAIL_WORKERS: '1'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_LIMIT: '10000'
          CGD_HEADLESS: '1'
          CGD_DIAGNOSTICO: '0'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== SINCRONIZAÇÃO COMPLETA: universo real Matriz + Filial ==='
          Write-Host '=== SEM LIMITE 20 | SEM LIMITE 750 | CHROMIUM HEADLESS ==='
          python -u scraper_sync_robusto.py

      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py

      - name: Validar coleta completa antes da publicação
        shell: powershell
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          @'
          import json
          from pathlib import Path

          alunos = json.loads(Path('dados_alunos.json').read_text(encoding='utf-8'))
          pop = json.loads(Path('dados_populacao_cgd.json').read_text(encoding='utf-8'))
          reps = json.loads(Path('dados_reposicoes.json').read_text(encoding='utf-8'))

          if not isinstance(alunos, list) or not alunos:
              raise SystemExit('Falha: dados_alunos.json vazio ou inválido.')

          unidades = {x.get('unidade'): x for x in pop.get('unidades', []) if x.get('unidade')}
          if set(unidades) != {'matriz', 'filial'}:
              raise SystemExit('Falha: população não contém Matriz e Filial.')

          contratos = [str(a.get('contrato') or a.get('cgd_matricula_id') or '').strip() for a in alunos]
          contratos = [x for x in contratos if x]
          if len(contratos) != len(set(contratos)):
              raise SystemExit('Falha: existem contratos duplicados na base final.')

          for unidade in ('matriz', 'filial'):
              registros = [a for a in alunos if a.get('unidade') == unidade]
              esperado = int(unidades[unidade].get('contratos_descobertos') or 0)
              capturados = int(unidades[unidade].get('capturados') or 0)
              falhas = int(unidades[unidade].get('falhas') or 0)
              print(f'{unidade.upper()}: CGD={esperado} capturados={capturados} base={len(registros)} falhas={falhas}')
              if esperado <= 0:
                  raise SystemExit(f'Falha: universo {unidade} vazio.')
              if capturados != esperado or len(registros) < esperado or falhas != 0:
                  raise SystemExit(f'Falha: universo {unidade} incompleto.')

          if reps.get('source') != 'CGD':
              raise SystemExit('Falha: reposições não têm fonte CGD.')

          print(f'TOTAL BASE: {len(alunos)}')
          print('VALIDAÇÃO UNIVERSO: OK')
          print('VALIDAÇÃO REPOSIÇÕES: OK')
          '@ | python -

      - name: Salvar coleta para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgd-coleta-${{ github.run_id }}
          path: |
            dados_alunos.json
            dados_reposicoes.json
            dados_dashboard_cgd.json
            dados_pacotes_cursos.json
            dados_frequencias_a_registrar.json
            dados_populacao_cgd.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json dados_dashboard_cgd.json dados_pacotes_cursos.json dados_frequencias_a_registrar.json dados_populacao_cgd.json
          if (git diff --cached --quiet) {
            Write-Host 'Nenhuma alteração nos dados sincronizados.'
          } else {
            git commit -m 'Auto-update: dados reais CGD - universo completo'
            git push
          }
