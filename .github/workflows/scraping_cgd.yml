name: Execução Automática Scraping CGD

on:
  schedule:
    # Roda automaticamente todos os dias às 08:00 UTC (05:00 Horário de Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite executar manualmente no painel do GitHub

jobs:
  executar-scraping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script de Scraping
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_USER: ${{ secrets.CGD_USER }}
          CGD_PASS: ${{ secrets.CGD_PASS }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
        run: python scraper.py

      - name: Salvar Relatório como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-alunos-cgd
          path: resultado_alunos.txt
