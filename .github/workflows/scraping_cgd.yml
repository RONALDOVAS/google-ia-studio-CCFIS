name: Execução Automática Scraping CGD

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scraper.py'
      - 'scraper_runner.py'
      - '.github/workflows/scraping_cgd.yml'

permissions:
  contents: write

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium

      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @(
            'CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL',
            'CGD_USER_MATRIZ','CGD_PASS_MATRIZ',
            'CGD_USER_FILIAL','CGD_PASS_FILIAL',
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Secret obrigatório ausente: $name"
            }
            Write-Host "$name = OK"
          }

      - name: Executar scraper CGD - listagem segura + detalhes paralelos
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '100'
          CGD_LISTING_WAIT_MS: '100'
          CGD_DETAIL_WORKERS: '4'
          CGD_LISTING_WORKERS: '1'
          CGD_LISTING_PAGES: '829'
          CGD_HEADLESS: 'true'
        run: python scraper_runner.py

      - name: Validar captura real de alunos
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) {
            throw 'Falha: dados_alunos.json não foi gerado.'
          }
          $dados = Get-Content 'dados_alunos.json' -Raw | ConvertFrom-Json
          if ($dados.Count -eq 0) {
            throw 'Falha: scraper terminou sem alunos. A execução NÃO será considerada sucesso.'
          }
          Write-Host "ALUNOS CAPTURADOS: $($dados.Count)"

      - name: Sincronizar reposições reais do CGD
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
        run: python sync_cgd_reposicoes.py

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json
          if (git diff --cached --quiet) {
            Write-Host 'Nenhuma alteração nos dados sincronizados.'
          } else {
            git commit -m 'Auto-update: dados reais CGD'
            git push
          }
