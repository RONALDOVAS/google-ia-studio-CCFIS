name: Execução Automática Scraping CGD

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Verificar configuração dos Secrets
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$CGD_LOGIN_URL" || true
          test -n "$CGD_USER_MATRIZ" || true
          test -n "$CGD_PASS_MATRIZ" || true
          test -n "$CGD_USER_FILIAL" || true
          test -n "$CGD_PASS_FILIAL" || true

      - name: Executar scraper original
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py

      - name: Sincronizar reposições reais do CGD
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
        run: python sync_cgd_reposicoes.py

      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit e Push dos dados públicos
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_alunos.json dados_reposicoes.json || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados sincronizados."
          else
            git commit -m "Auto-update: dados reais CGD"
            git push
          fi
