name: Execução Automática Scraping CGD

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-scraping:
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 1. BAIXAR CÓDIGO
      # ================================================================

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # ================================================================
      # 2. CONFIGURAR PYTHON
      # ================================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ================================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ================================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright-stealth

      # ================================================================
      # 4. INSTALAR CHROMIUM PELO PLAYWRIGHT PYTHON
      # ================================================================

      - name: Instalar Navegador do Playwright
        run: |
          python -m playwright install --with-deps chromium

      # ================================================================
      # 5. EXECUTAR SCRAPER
      # ================================================================

      - name: Executar Script de Scraping
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}

          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}

          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}

          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python scraper.py

      # ================================================================
      # 6. SALVAR DIAGNÓSTICOS COMO ARTIFACT
      # ================================================================

      - name: Salvar diagnóstico do scraping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: diagnostico_scraping/
          if-no-files-found: warn
          retention-days: 7

      # ================================================================
      # 7. MOSTRAR STATUS DO JSON
      # ================================================================

      - name: Verificar dados_alunos.json
        if: always()
        run: |
          echo "=========================================="
          echo "STATUS DO dados_alunos.json"
          echo "=========================================="

          if [ -f dados_alunos.json ]; then
            echo "Arquivo encontrado."
            echo "Quantidade de linhas:"
            wc -l dados_alunos.json
            echo ""
            echo "Primeiras linhas:"
            head -40 dados_alunos.json
          else
            echo "dados_alunos.json não encontrado."
          fi

      # ================================================================
      # 8. COMMIT E PUSH DO JSON
      # ================================================================

      - name: Commit e Push do arquivo JSON
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add dados_alunos.json || true

          git diff --cached --quiet || git commit -m "Auto-update: atualiza dados_alunos.json"

          git push
