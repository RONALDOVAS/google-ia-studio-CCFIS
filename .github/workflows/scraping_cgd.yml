name: Execução Manual Scraping CGD

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scraping_cgd.yml'
      - 'scraper_sync_incremental.py'

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: false

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium
      - name: Validar parser de frequência determinístico
        shell: powershell
        run: python -m unittest -v test_frequencia_parser_cgd.py
      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @('CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL','CGD_USER_MATRIZ','CGD_PASS_MATRIZ','CGD_USER_FILIAL','CGD_PASS_FILIAL','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Secret obrigatório ausente: $name" }
            Write-Host "$name = OK"
          }
      - name: Sincronizar universo completo CGD - incremental
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_LISTING_PAGES: '831'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_LISTING_TIMEOUT_S: '30'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_INTERVAL_MS: '200'
          CGD_HEADLESS: 'false'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== SINCRONIZAÇÃO CGD: UNIVERSO COMPLETO + DETECÇÃO DE MUDANÇAS ==='
          Write-Host '=== NÃO EXISTE MAIS META CUMULATIVA DE 750 POR UNIDADE ==='
          python -c "import sitecustomize; print('PATCH_LOGIN_CGD_CARREGADO=OK')"
          python -u scraper_sync_incremental.py
      - name: Auditar frequências reais, último acesso e Frequências a Registrar
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_PAGE_WAIT_MS: '100'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: python -u auditar_frequencias_cgd.py
      - name: Validar sincronização do universo
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) { throw 'Falha: dados_alunos.json não foi gerado.' }
          if (-not (Test-Path 'dados_universo_cgd.json')) { throw 'Falha: snapshot do universo CGD não foi gerado.' }
          if (-not (Test-Path 'dados_dashboard_cgd.json')) { throw 'Falha: dados_dashboard_cgd.json não foi gerado.' }
          if (-not (Test-Path 'dados_pacotes_cursos.json')) { throw 'Falha: dados_pacotes_cursos.json não foi gerado.' }
          if (-not (Test-Path 'dados_frequencias_a_registrar.json')) { throw 'Falha: snapshot de Frequencias a Registrar não foi gerado.' }
          @'
          import json
          from pathlib import Path
          dados = json.loads(Path('dados_alunos.json').read_text(encoding='utf-8'))
          snap = json.loads(Path('dados_universo_cgd.json').read_text(encoding='utf-8'))
          dash = json.loads(Path('dados_dashboard_cgd.json').read_text(encoding='utf-8'))
          pac = json.loads(Path('dados_pacotes_cursos.json').read_text(encoding='utf-8'))
          if not isinstance(dados, list) or not dados:
              raise SystemExit('Falha: base de alunos vazia/inválida.')
          unidades = snap.get('unidades', {})
          if set(unidades) != {'matriz','filial'}:
              raise SystemExit(f'Falha: universo não contém Matriz e Filial: {sorted(unidades)}')
          contratos_base = {str(a.get('contrato') or a.get('cgd_matricula_id') or '') for a in dados if a.get('contrato') or a.get('cgd_matricula_id')}
          contratos_snapshot = set()
          for unidade in ('matriz','filial'):
              info = unidades[unidade]
              ids = set(info.get('contratos', {}).keys())
              contratos_snapshot |= ids
              print(f'{unidade.upper()}: UNIVERSO={info.get("total",0)} NOVOS={info.get("novos",0)} ALTERADOS={info.get("alterados",0)} SEM_MUDANCA={info.get("sem_mudanca",0)} ERROS_LISTAGEM={info.get("paginas_com_erro",0)}')
              if info.get('paginas_com_erro',0) >= 416:
                  raise SystemExit(f'Falha: listagem insuficiente na {unidade}.')
              if info.get('total',0) != len(ids):
                  raise SystemExit(f'Falha: total/snapshot divergente na {unidade}.')
          if not contratos_snapshot.issubset(contratos_base):
              faltantes = sorted(contratos_snapshot - contratos_base)
              raise SystemExit(f'Falha: contratos do universo ausentes da base: {faltantes[:20]}')
          validos = [c for c in contratos_base if c]
          if len(validos) != len(set(validos)):
              raise SystemExit('Falha: contratos duplicados na base.')
          dash_ok = [x for x in dash.get('unidades', []) if x.get('ok')]
          pac_ok = [x for x in pac.get('unidades', []) if x.get('ok')]
          print(f'UNIVERSO CGD DESCOBERTO: {len(contratos_snapshot)}')
          print(f'BASE PERSISTIDA: {len(dados)}')
          print(f'DASHBOARD CGD CAPTURADO: {len(dash_ok)}/2')
          print(f'FONTES DE PACOTES CAPTURADAS: {len(pac_ok)}/4')
          if len(dash_ok) != 2:
              raise SystemExit(f'Falha: Dashboard CGD não capturado nas duas unidades: {len(dash_ok)}/2.')
          if len(pac_ok) != 4:
              raise SystemExit(f'Falha: fontes de pacote/relatório não capturadas: {len(pac_ok)}/4.')
          print('VALIDAÇÃO UNIVERSO + INCREMENTAL: OK')
          '@ | python
      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py
      - name: Validar reposições capturadas
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_reposicoes.json')) { throw 'Falha: dados_reposicoes.json não foi gerado.' }
          $rep = Get-Content 'dados_reposicoes.json' -Raw | ConvertFrom-Json
          Write-Host "REPOSICOES CAPTURADAS: $($rep.records.Count)"
          if ($rep.source -ne 'CGD') { throw 'Falha: fonte de reposições não é CGD.' }
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd-${{ github.run_id }}
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_universo_cgd.json
            dados_reposicoes.json
            dados_dashboard_cgd.json
            dados_pacotes_cursos.json
            dados_frequencias_a_registrar.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_universo_cgd.json dados_reposicoes.json dados_dashboard_cgd.json dados_pacotes_cursos.json dados_frequencias_a_registrar.json
          if (git diff --cached --quiet) {
            Write-Host 'Nenhuma alteração nos dados sincronizados.'
          } else {
            git commit -m 'Auto-update: universo CGD sincronizado incrementalmente'
            git push
          }
