name: Execução Automática Scraping CGD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dados_alunos.json'
      - 'dados_reposicoes.json'
      - 'dados_dashboard_cgd.json'
      - 'dados_pacotes_cursos.json'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: true

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium
      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @('CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL','CGD_USER_MATRIZ','CGD_PASS_MATRIZ','CGD_USER_FILIAL','CGD_PASS_FILIAL','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Secret obrigatório ausente: $name" }
            Write-Host "$name = OK"
          }
      - name: Executar scraper CGD - alvo incremental 50 + 50
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '100'
          CGD_LISTING_WAIT_MS: '100'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_DETAIL_HTTP_WORKERS: '1'
          CGD_DETAIL_WORKERS: '1'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_LIMIT: '50'
          CGD_DETAIL_TARGET_PER_UNIT: '50'
          CGD_LISTING_PAGES: '831'
          CGD_DETAIL_INTERVAL_MS: '1200'
          CGD_HEADLESS: 'false'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== CGD INCREMENTAL: alvo cumulativo 50 por unidade | listagem 831 paginas | detalhe 1 sessao ==='
          python -u scraper_runner_threaded.py
      - name: Auditar e atualizar base real dos 100 contratos
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_PAGE_WAIT_MS: '100'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== AUDITORIA: frequencia + sem frequencia + campanha + pacote + dashboard ==='
          python -u auditar_base_cgd.py
      - name: Validar captura real e base auditada
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) { throw 'Falha: dados_alunos.json não foi gerado.' }
          if (-not (Test-Path 'dados_dashboard_cgd.json')) { throw 'Falha: dados_dashboard_cgd.json não foi gerado.' }
          if (-not (Test-Path 'dados_pacotes_cursos.json')) { throw 'Falha: dados_pacotes_cursos.json não foi gerado.' }
          @'
          import json
          from pathlib import Path
          dados = json.loads(Path('dados_alunos.json').read_text(encoding='utf-8'))
          dash = json.loads(Path('dados_dashboard_cgd.json').read_text(encoding='utf-8'))
          pac = json.loads(Path('dados_pacotes_cursos.json').read_text(encoding='utf-8'))
          if not isinstance(dados, list) or not dados:
              raise SystemExit('Falha: base de alunos vazia/inválida.')
          com_freq = [a for a in dados if a.get('frequencia_raw')]
          sem_freq = [a for a in dados if not a.get('frequencia_raw')]
          valid_status = ('SEM_FREQUENCIA_AGUARDANDO_INICIO','SEM_FREQUENCIA_CONTRATO_ENCERRADO','SEM_FREQUENCIA_A_INVESTIGAR')
          sem_class = [a for a in sem_freq if a.get('frequencia_status') in valid_status]
          matriz = [a for a in dados if a.get('unidade') == 'matriz']
          filial = [a for a in dados if a.get('unidade') == 'filial']
          contratos = [str(a.get('contrato') or '') for a in dados]
          duplicados = len(contratos) - len(set(contratos))
          campanhas = [a for a in dados if str(a.get('campanha') or '').strip()]
          pacotes = [a for a in dados if str(a.get('pacote') or '').strip()]
          freq_validacao = [a for a in dados if isinstance(a.get('frequencia_validacao_interna'), dict) and a['frequencia_validacao_interna'].get('ok')]
          dash_ok = [x for x in dash.get('unidades', []) if x.get('ok')]
          pac_ok = [x for x in pac.get('unidades', []) if x.get('ok')]
          print(f'ALUNOS NA BASE: {len(dados)}')
          print(f'FREQUENCIA REAL: {len(com_freq)}')
          print(f'SEM FREQUENCIA: {len(sem_freq)}')
          print(f'SEM FREQUENCIA CLASSIFICADOS: {len(sem_class)}')
          print(f'MATRIZ: {len(matriz)}')
          print(f'FILIAL: {len(filial)}')
          print(f'CAMPAÑA PREENCHIDA: {len(campanhas)}')
          print(f'PACOTE PREENCHIDO: {len(pacotes)}')
          print(f'FREQUENCIA COM VALIDACAO INTERNA: {len(freq_validacao)}')
          print(f'DASHBOARD CGD CAPTURADO: {len(dash_ok)}/2')
          print(f'FONTES DE PACOTES CAPTURADAS: {len(pac_ok)}/4')
          print(f'CONTRATOS DUPLICADOS: {duplicados}')
          if len(sem_freq) != len(sem_class):
              raise SystemExit('Falha: aluno sem frequência sem classificação semântica.')
          if len(freq_validacao) != len(dados):
              raise SystemExit('Falha: existem registros de frequência sem validação interna.')
          if duplicados:
              raise SystemExit(f'Falha: existem {duplicados} contratos duplicados.')
          if len(matriz) != 50 or len(filial) != 50 or len(dados) != 100:
              raise SystemExit(f'Falha: base incremental esperada 50+50, obtido {len(matriz)}+{len(filial)} total={len(dados)}.')
          if len(dash_ok) != 2:
              raise SystemExit(f'Falha: Dashboard CGD não capturado nas duas unidades: {len(dash_ok)}/2.')
          if len(pac_ok) != 4:
              raise SystemExit(f'Falha: fontes de pacote/relatório não capturadas: {len(pac_ok)}/4.')
          '@ | python -
      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py
      - name: Validar reposições capturadas
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_reposicoes.json')) { throw 'Falha: dados_reposicoes.json não foi gerado.' }
          $rep = Get-Content 'dados_reposicoes.json' -Raw | ConvertFrom-Json
          Write-Host "REPOSICOES CAPTURADAS: $($rep.records.Count)"
          if ($rep.source -ne 'CGD') { throw 'Falha: fonte de reposições não é CGD.' }
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
            dados_dashboard_cgd.json
            dados_pacotes_cursos.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json dados_dashboard_cgd.json dados_pacotes_cursos.json
          if (git diff --cached --quiet) { Write-Host 'Nenhuma alteração nos dados sincronizados.' }
          else { git commit -m 'Auto-update: dados reais CGD'; git push }
