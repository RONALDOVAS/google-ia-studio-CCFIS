name: Execução Automática Scraping CGD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dados_alunos.json'
      - 'dados_reposicoes.json'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: true

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium
      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @('CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL','CGD_USER_MATRIZ','CGD_PASS_MATRIZ','CGD_USER_FILIAL','CGD_PASS_FILIAL','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Secret obrigatório ausente: $name" }
            Write-Host "$name = OK"
          }
      - name: Executar scraper CGD - somente campanha Informatica
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '100'
          CGD_LISTING_WAIT_MS: '100'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_DETAIL_HTTP_WORKERS: '3'
          CGD_DETAIL_WORKERS: '3'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_LIMIT: '50'
          CGD_DETAIL_TARGET_PER_UNIT: '50'
          CGD_LISTING_PAGES: '831'
          CGD_HEADLESS: 'false'
          CGD_DIAGNOSTICO: '0'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== CGD: filtro campanha Informatica ANTES do detalhamento ==='
          $ok = $false
          python -u scraper_runner_threaded.py 2>&1 | ForEach-Object {
            $line = $_.ToString()
            Write-Host $line
            if ($line -match '\[(matriz|filial)\].*ALUNO_VALIDADO') {
              Write-Progress -Activity "Scraping CGD - campanha Informatica" -Status $line
            }
            elseif ($line -match '\[(matriz|filial)\].*CONTRATOS NOVOS INFORMATICA=(\d+)') {
              Write-Progress -Activity "Scraping CGD - campanha Informatica" -Status $line
            }
            elseif ($line -match '\[(matriz|filial)\].*INICIANDO DETALHAMENTO PARALELO') {
              Write-Progress -Activity "Scraping CGD - campanha Informatica" -Status $line
            }
            elseif ($line -match '\[INCREMENTAL\] DISTRIBUICAO_CAMPANHAS=') {
              $ok = $true
              Write-Progress -Activity "Scraping CGD - campanha Informatica" -Completed
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Scraper terminou com código $LASTEXITCODE" }
          if (-not $ok) { Write-Host 'Aviso: marcador final de campanhas não apareceu; a validação abaixo decidirá.' }
      - name: Validar captura real - somente Informatica
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) { throw 'Falha: dados_alunos.json não foi gerado.' }
          @'
          import json
          import unicodedata
          from pathlib import Path
          def norm(v):
              s = ' '.join(str(v or '').replace('\xa0',' ').split()).lower()
              return ''.join(c for c in unicodedata.normalize('NFD', s) if unicodedata.category(c) != 'Mn')
          dados = json.loads(Path('dados_alunos.json').read_text(encoding='utf-8'))
          if not isinstance(dados, list) or not dados:
              raise SystemExit('Falha: dados_alunos.json vazio ou inválido.')
          fora = [a for a in dados if 'informatica' not in norm(a.get('campanha'))]
          sem_freq = [a for a in dados if not a.get('frequencia_raw')]
          contratos = [str(a.get('contrato') or '') for a in dados]
          duplicados = len(contratos) - len(set(contratos))
          matriz = [a for a in dados if a.get('unidade') == 'matriz']
          filial = [a for a in dados if a.get('unidade') == 'filial']
          print(f'ALUNOS PERSISTIDOS: {len(dados)}')
          print(f'MATRIZ INFORMATICA: {len(matriz)}')
          print(f'FILIAL INFORMATICA: {len(filial)}')
          print(f'FORA DA CAMPANHA INFORMATICA: {len(fora)}')
          print(f'SEM FREQUENCIA REAL: {len(sem_freq)}')
          print(f'CONTRATOS DUPLICADOS: {duplicados}')
          if fora: raise SystemExit('Falha: existem alunos de campanha diferente de Informatica.')
          if sem_freq: raise SystemExit('Falha: existem alunos sem frequência real.')
          if duplicados: raise SystemExit('Falha: existem contratos duplicados.')
          if len(matriz) != 50 or len(filial) != 50:
              raise SystemExit(f'Falha: esperado 50 + 50 Informatica; obtido {len(matriz)} + {len(filial)}.')
          '@ | python -
      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py
      - name: Validar reposições capturadas
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_reposicoes.json')) { throw 'Falha: dados_reposicoes.json não foi gerado.' }
          $rep = Get-Content 'dados_reposicoes.json' -Raw | ConvertFrom-Json
          Write-Host "REPOSICOES CAPTURADAS: $($rep.records.Count)"
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json
          if (git diff --cached --quiet) { Write-Host 'Nenhuma alteração nos dados sincronizados.' }
          else { git commit -m 'Auto-update: dados reais CGD'; git push }
