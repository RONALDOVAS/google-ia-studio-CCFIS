name: Execução Automática Scraping CGD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dados_alunos.json'
      - 'dados_reposicoes.json'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraping-cgd
  cancel-in-progress: true

jobs:
  executar-scraping:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python e Playwright
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium
      - name: Validar Secrets obrigatórios
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $required = @('CGD_LOGIN_URL','CGD_MATRIZ_URL','CGD_FILIAL_URL','CGD_USER_MATRIZ','CGD_PASS_MATRIZ','CGD_USER_FILIAL','CGD_PASS_FILIAL','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Secret obrigatório ausente: $name" }
            Write-Host "$name = OK"
          }
      - name: Executar scraper CGD - alvo incremental 50 + 50
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_MATRIZ_URL: ${{ secrets.CGD_MATRIZ_URL }}
          CGD_FILIAL_URL: ${{ secrets.CGD_FILIAL_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGD_MAX_LINK_PAGES: '5000'
          CGD_MAX_CONTRACTS: '10000'
          CGD_PAGE_WAIT_MS: '100'
          CGD_LISTING_WAIT_MS: '100'
          CGD_LISTING_HTTP_WORKERS: '12'
          CGD_DETAIL_HTTP_WORKERS: '3'
          CGD_DETAIL_WORKERS: '3'
          CGD_DETAIL_TIMEOUT_S: '45'
          CGD_DETAIL_RETRIES: '0'
          CGD_DETAIL_LIMIT: '50'
          CGD_DETAIL_TARGET_PER_UNIT: '50'
          CGD_LISTING_PAGES: '5'
          CGD_HEADLESS: 'false'
          CGD_DIAGNOSTICO: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          Write-Host '=== CGD INCREMENTAL: alvo cumulativo 50 por unidade | listagem 5 paginas ==='
          python -u scraper_runner_threaded.py
      - name: Validar captura real incremental de alunos
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_alunos.json')) { throw 'Falha: dados_alunos.json não foi gerado.' }
          @'
          import json
          from pathlib import Path
          p = Path('dados_alunos.json')
          dados = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(dados, list):
              raise SystemExit(f'Falha: raiz de dados_alunos.json não é lista: {type(dados).__name__}')
          if len(dados) == 0:
              raise SystemExit('Falha: scraper terminou sem alunos.')
          com_freq = [a for a in dados if a.get('frequencia_raw')]
          sem_freq = len(dados) - len(com_freq)
          matriz = [a for a in dados if a.get('unidade') == 'matriz']
          filial = [a for a in dados if a.get('unidade') == 'filial']
          contratos = [str(a.get('contrato') or '') for a in dados]
          duplicados = len(contratos) - len(set(contratos))
          campanhas_preenchidas = [a for a in dados if str(a.get('campanha') or '').strip()]
          print(f'ALUNOS CAPTURADOS: {len(dados)}')
          print(f'ALUNOS COM FREQUENCIA REAL: {len(com_freq)}')
          print(f'ALUNOS SEM FREQUENCIA: {sem_freq}')
          print(f'MATRIZ: {len(matriz)}')
          print(f'FILIAL: {len(filial)}')
          print(f'ALUNOS COM CAMPO CAMPANHA PREENCHIDO: {len(campanhas_preenchidas)}')
          print(f'ALUNOS SEM CAMPO CAMPANHA: {len(dados) - len(campanhas_preenchidas)}')
          print(f'CONTRATOS DUPLICADOS: {duplicados}')
          if sem_freq:
              raise SystemExit(f'Falha: existem {sem_freq} alunos sem frequência real.')
          if duplicados:
              raise SystemExit(f'Falha: existem {duplicados} contratos duplicados.')
          if len(matriz) != 50 or len(filial) != 50:
              raise SystemExit(f'Falha incremental: esperado 50 matriz + 50 filial; obtido {len(matriz)} + {len(filial)}.')
          if len(dados) != 100:
              raise SystemExit(f'Falha incremental: esperado total 100 alunos; obtido {len(dados)}.')
          '@ | python -
      - name: Gerar reposições reais a partir dos alunos capturados
        shell: powershell
        run: python build_reposicoes_from_alunos.py
      - name: Validar reposições capturadas
        shell: powershell
        run: |
          if (-not (Test-Path 'dados_reposicoes.json')) { throw 'Falha: dados_reposicoes.json não foi gerado.' }
          $rep = Get-Content 'dados_reposicoes.json' -Raw | ConvertFrom-Json
          Write-Host "REPOSICOES CAPTURADAS: $($rep.records.Count)"
      - name: Salvar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraping-cgd
          path: |
            diagnostico_scraping/
            dados_alunos.json
            dados_reposicoes.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit e Push dos dados públicos
        if: success()
        shell: powershell
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_alunos.json dados_reposicoes.json
          if (git diff --cached --quiet) { Write-Host 'Nenhuma alteração nos dados sincronizados.' }
          else { git commit -m 'Auto-update: dados reais CGD'; git push }
