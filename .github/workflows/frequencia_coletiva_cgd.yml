name: Auditoria Coletiva de Frequências CGD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frequencia-coletiva-cgd
  cancel-in-progress: false

jobs:
  capturar-frequencias-coletivas:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          python -m playwright install chromium
      - name: Capturar rotas coletivas autenticadas
        shell: powershell
        env:
          CGD_LOGIN_URL: ${{ secrets.CGD_LOGIN_URL }}
          CGD_USER_MATRIZ: ${{ secrets.CGD_USER_MATRIZ }}
          CGD_PASS_MATRIZ: ${{ secrets.CGD_PASS_MATRIZ }}
          CGD_USER_FILIAL: ${{ secrets.CGD_USER_FILIAL }}
          CGD_PASS_FILIAL: ${{ secrets.CGD_PASS_FILIAL }}
          CGD_HEADLESS: 'false'
          CGD_PAGE_WAIT_MS: '300'
          PYTHONUNBUFFERED: '1'
        run: python -u frequencia_coletiva_cgd.py
      - name: Publicar evidências da captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frequencia-coletiva-cgd-${{ github.run_id }}
          path: dados_frequencias_a_registrar.json
          if-no-files-found: warn
          retention-days: 7
